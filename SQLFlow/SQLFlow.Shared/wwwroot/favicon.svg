    </defs>
    <rect x="0" y="0" width="456" height="456" rx="72" fill="url(#bg)" />

    <line x1="228" y1="100" x2="228" y2="114" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <circle cx="228" cy="90" r="10" fill="#ffffff" />
