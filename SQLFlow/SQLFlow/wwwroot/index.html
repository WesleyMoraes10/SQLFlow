        (function () {
            try {
                var stored = localStorage.getItem('sqlflow-theme');
                var theme = (stored === 'dark' || stored === 'freshcut-contrast' || stored === 'juju' || stored === 'green-weslin' || stored === 'green-weslin-dark') ? stored : 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* armazenamento indisponível: mantém o tema claro padrão */ }
        })();
    </script>
