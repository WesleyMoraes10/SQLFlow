<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="620" height="300" viewBox="0 0 620 300" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Canvas real da splash nativa do Windows é 620x300 (bem larga), então o layout aqui é
         horizontal: ícone à esquerda + nome/descrição à direita, em vez do ícone sozinho e
         perdido no meio de um retângulo vazio. Fundo sólido vem do MauiSplashScreen (Color, em
         SQLFlow.csproj) — aqui só o conteúdo, transparente. -->
    <g transform="translate(-52,-53.6) scale(0.797)">
        <line x1="228" y1="65" x2="228" y2="79" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
        <circle cx="228" cy="55" r="10" fill="#ffffff" />
        <rect x="73" y="162" width="19" height="61" rx="10" fill="#ffffff" fill-opacity="0.85" />
        <rect x="364" y="162" width="19" height="61" rx="10" fill="#ffffff" fill-opacity="0.85" />
        <rect x="86" y="79" width="284" height="226" rx="49" fill="#ffffff" />
        <circle cx="166" cy="176" r="25" fill="#1c2b38" />
        <circle cx="290" cy="176" r="25" fill="#1c2b38" />
        <rect x="161" y="227" width="133" height="26" rx="13" fill="#1c2b38" fill-opacity="0.55" />
        <circle cx="182" cy="366" r="15" fill="#c74634" />
        <circle cx="228" cy="366" r="15" fill="#0078d4" />
        <circle cx="274" cy="366" r="15" fill="#00758f" />
    </g>

    <text x="248" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">SQLFlow</text>
    <text x="250" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#a9b7c4">Gerenciamento de banco de dados</text>

    <circle cx="258" cy="207" r="5" fill="#c74634" />
    <text x="270" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c9d3dc">Oracle</text>
    <circle cx="340" cy="207" r="5" fill="#0078d4" />
    <text x="352" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c9d3dc">SQL Server</text>
    <circle cx="446" cy="207" r="5" fill="#00758f" />
    <text x="458" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c9d3dc">MySQL</text>
</svg>
