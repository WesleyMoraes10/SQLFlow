<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Mesmo ícone do app (Resources/AppIcon) combinado num único SVG, pra servir de favicon
         no projeto Web/WASM (DevelopTi.Web) — mantém a marca consistente em todos os "front doors". -->
    <defs>
        <linearGradient id="bg" x1="60" y1="0" x2="396" y2="456" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3d8fd1" />
            <stop offset="55%" stop-color="#1f5b8f" />
            <stop offset="100%" stop-color="#1c2b38" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="456" height="456" rx="72" fill="url(#bg)" />

    <polygon points="128,298 228,270 328,298 228,326" fill="#ffffff" fill-opacity="0.70" />
    <polygon points="128,228 228,200 328,228 228,256" fill="#ffffff" fill-opacity="0.85" />
    <polygon points="128,158 228,130 328,158 228,186" fill="#ffffff" />

    <circle cx="182" cy="366" r="15" fill="#c74634" />
    <circle cx="228" cy="366" r="15" fill="#0078d4" />
    <circle cx="274" cy="366" r="15" fill="#00758f" />
</svg>
