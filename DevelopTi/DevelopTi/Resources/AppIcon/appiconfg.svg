<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Pilha de dados: três camadas empilhadas com espaço entre elas, o motivo clássico de
         "stack"/dados em ferramentas do gênero, desenhado só com formas geométricas (sem
         ícone de biblioteca externa, seguindo o padrão do resto do app). -->
    <polygon points="128,298 228,270 328,298 228,326" fill="#ffffff" fill-opacity="0.70" />
    <polygon points="128,228 228,200 328,228 228,256" fill="#ffffff" fill-opacity="0.85" />
    <polygon points="128,158 228,130 328,158 228,186" fill="#ffffff" />
    <polygon points="128,158 228,130 328,158 228,186" fill="none" stroke="#1c2b38" stroke-opacity="0.15" stroke-width="4" stroke-linejoin="round" />

    <!-- Três pontos nas cores oficiais de Oracle, SQL Server e MySQL — os bancos que o app suporta -->
    <circle cx="182" cy="366" r="15" fill="#c74634" />
    <circle cx="228" cy="366" r="15" fill="#0078d4" />
    <circle cx="274" cy="366" r="15" fill="#00758f" />
</svg>
